# Biocompare vendor registry.
# Each vendor has a name and a Biocompare vids number for URL filtering.
# URL pattern: https://www.biocompare.com/Search-Antibodies/?said=0&soids={type_id}&vids={vid1},{vid2},...
#
# To find a new vendor's vid: search on Biocompare, click the vendor filter,
# and look at the &vids= parameter in the URL.

# Antibody type IDs (soids parameter)
antibody_types:
  primary:
    soids: "269752"
    label: "Primary Antibodies"
  secondary:
    soids: "218589"
    label: "Secondary Antibodies"
  pairs:
    soids: "2318295"
    label: "Antibody Pairs"

