  mCherry:
    ex_peak: 587
    em_peak: 610
    brightness: Moderate
    laser_lines: [561]
    is_tandem: false
    is_polymer: false
    notes: "Protein reporter; often used in live imaging"

  Cy3:
    ex_peak: 550
    em_peak: 570
    brightness: High
    laser_lines: [532, 561]
    is_tandem: false
    is_polymer: false
    notes: "Cyanine dye; excellent for tissue sections"

  Alexa Fluor 594:
    ex_peak: 590
    em_peak: 617
    brightness: High
    laser_lines: [561, 594]
    is_tandem: false
    is_polymer: false
    notes: "Good separation from AF555 and AF647"

  mOrange:
    ex_peak: 549
    em_peak: 562
    brightness: Moderate
    laser_lines: [532, 561]
    is_tandem: false
    is_polymer: false
    notes: "Fluorescent protein reporter"

  Alexa Fluor 633:
    ex_peak: 632
    em_peak: 647
    brightness: High
    laser_lines: [633, 640]
    is_tandem: false
    is_polymer: false
    notes: "Red laser; good for low-abundance targets"

  Alexa Fluor 647:
    ex_peak: 650
    em_peak: 668
    brightness: Very High
    laser_lines: [633, 640, 647]
