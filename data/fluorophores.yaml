  APC-R700:
    ex_peak: 650
    em_peak: 723
    brightness: High
    laser_lines: [633, 640]
    is_tandem: true
    is_polymer: false
    manufacturer_family: "BD Horizon"
    notes: "BD Horizon tandem"

  Cy7:
    ex_peak: 743
    em_peak: 767
    brightness: Moderate
    laser_lines: [720, 730]
    is_tandem: false
    is_polymer: false
